<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Ultra-Resilient MindAR Camera Scanner</title>
  
  <!-- A-Frame v1.5.0 -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- MindAR v1.2.5 -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000;
      -webkit-tap-highlight-color: transparent;
    }

    .a-canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    #ar-hud-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(16px, var(--sat)) 16px max(24px, var(--sab)) 16px;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .status-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
      flex-shrink: 0;
    }

    .status-dot.found {
      background: #10b981;
      box-shadow: 0 0 12px #10b981;
    }

    .camera-switch-btn {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .scanner-reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(290px, 75vw);
      height: min(290px, 75vw);
      border: 2px solid rgba(0, 242, 254, 0.4);
      border-radius: 24px;
      pointer-events: none;
      box-shadow: 0 0 35px rgba(0, 242, 254, 0.2);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .scanner-reticle.found {
      border-color: #10b981;
      box-shadow: 0 0 50px rgba(16, 185, 129, 0.5);
      transform: translate(-50%, -50%) scale(1.04);
    }

    .corner {
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: #00f2fe;
      border-style: solid;
    }

    .tl { top: -2px; left: -2px; border-width: 4px 0 0 4px; border-top-left-radius: 18px; }
    .tr { top: -2px; right: -2px; border-width: 4px 4px 0 0; border-top-right-radius: 18px; }
    .bl { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; border-bottom-left-radius: 18px; }
    .br { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; border-bottom-right-radius: 18px; }

    .laser-line {
      position: absolute;
      left: 8px;
      right: 8px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00f2fe, #38bdf8, transparent);
      box-shadow: 0 0 14px #00f2fe;
      animation: scanAnim 2.2s ease-in-out infinite alternate;
    }

    @keyframes scanAnim {
      0% { top: 10%; opacity: 0.2; }
      50% { opacity: 1; }
      100% { top: 90%; opacity: 0.2; }
    }

    #target-toast {
      position: absolute;
      bottom: max(30px, var(--sab));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(16, 185, 129, 0.95);
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.5);
      display: none;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      max-width: 90vw;
    }
  </style>
</head>
<body>

  <!-- AR HUD Overlay -->
  <div id="ar-hud-overlay">
    <div class="hud-header">
      <div class="status-pill">
        <div id="status-dot" class="status-dot"></div>
        <span id="status-text">Scanning Photo Print [Ultra-Resilient Engine]...</span>
      </div>

      <button id="camera-flip-btn" class="camera-switch-btn" title="Flip Camera">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 10c0-4.4-3.6-8-8-8s-8 3.6-8 8h-3l4 4 4-4h-3c0-3.3 2.7-6 6-6s6 2.7 6 6h3z"/>
          <path d="M4 14c0 4.4 3.6 8 8 8s8-3.6 8-8h3l-4-4-4 4h3c0 3.3-2.7 6-6 6s-6-2.7-6-6h-3z"/>
        </svg>
      </button>
    </div>

    <div id="reticle" class="scanner-reticle">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div id="laser" class="laser-line"></div>
    </div>

    <div id="target-toast">
      <span>✨ PHOTO LOCK ACQUIRED — Playing Paired Video</span>
    </div>
  </div>

  <!-- A-Frame WebAR Scene with Ultra-Resilient MindAR Tracking Parameters -->
  <a-scene 
    mindar-image="imageTargetSrc: /targets/targets.mind; autoStart: true; filterMinCF: 0.00001; filterBeta: 0.0001; missTolerance: 18; warmupTolerance: 3; uiScanning: #reticle; uiLoading: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets id="scene-assets">
      <video id="ar-video-stream" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target Index 0 (Physical Photo Target) -->
    <a-entity id="target-entity-0" mindar-image-target="targetIndex: 0">
      
      <!-- Video Texture Overlay Plane -->
      <a-video id="ar-video-plane" src="#ar-video-stream" position="0 0 0.05" width="1" height="0.75" rotation="0 0 0"></a-video>

      <!-- 3D Holographic Orbit Ring -->
      <a-torus position="0 0 0.1" radius="0.48" radius-tubular="0.015" material="color: #00f2fe; metalness: 0.8; opacity: 0.8; transparent: true"
               animation="property: rotation; to: 0 360 360; loop: true; dur: 6000; easing: linear">
      </a-torus>

      <!-- Inner Spinning Octahedron Crystal -->
      <a-octahedron position="0 0 0.2" radius="0.18" material="color: #38bdf8; wireframe: true; wireframeLinewidth: 2"
                    animation="property: rotation; to: 360 360 0; loop: true; dur: 4000; easing: linear">
      </a-octahedron>

      <!-- Floating Hologram Text Banner -->
      <a-text id="ar-title-text" value="WEBAR VIDEO ACTIVE" position="0 -0.65 0.1" align="center" width="2.2" color="#00f2fe"
              font="kelsonsans"
              animation="property: position; to: 0 -0.6 0.15; dir: alternate; loop: true; dur: 1500; easing: easeInOutSine">
      </a-text>

      <!-- Glowing Light Source -->
      <a-light type="point" color="#00f2fe" intensity="2.5" distance="3" position="0 0 0.5"></a-light>
    </a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.querySelector('a-scene');
      const targetEntity = document.querySelector('#target-entity-0');
      const statusDot = document.getElementById('status-dot');
      const statusText = document.getElementById('status-text');
      const reticle = document.getElementById('reticle');
      const laser = document.getElementById('laser');
      const toast = document.getElementById('target-toast');
      const cameraFlipBtn = document.getElementById('camera-flip-btn');
      const videoStream = document.getElementById('ar-video-stream');
      const arTitleText = document.getElementById('ar-title-text');

      // Check active global media URL
      const urlParams = new URLSearchParams(window.location.search);
      let activeMediaUrl = urlParams.get('mediaUrl') || urlParams.get('videoUrl');
      let activeTitle = urlParams.get('title');

      if (!activeMediaUrl) {
        try {
          const stored = localStorage.getItem('ACTIVE_AR_MEDIA');
          if (stored) {
            const parsed = JSON.parse(stored);
            activeMediaUrl = parsed.media_url || parsed.video_url;
            activeTitle = parsed.title;
          }
        } catch (e) {}
      }

      if (activeMediaUrl && videoStream) {
        videoStream.setAttribute('src', activeMediaUrl);
      }

      if (activeTitle && arTitleText) {
        arTitleText.setAttribute('value', activeTitle.toUpperCase());
      }

      if (targetEntity) {
        targetEntity.addEventListener("targetFound", () => {
          console.log("MindAR: Photo Match Confirmed!");
          statusDot.classList.add('found');
          statusText.innerText = "Photo Match Lock Acquired! [Video Playing]";
          reticle.classList.add('found');
          if (laser) laser.style.display = 'none';
          toast.style.display = 'flex';

          if (videoStream) {
            videoStream.play().catch(e => console.log("Autoplay note:", e));
          }
        });

        targetEntity.addEventListener("targetLost", () => {
          console.log("MindAR: Photo Target Lost");
          statusDot.classList.remove('found');
          statusText.innerText = "Scanning Photo Print [Ultra-Resilient Engine]...";
          reticle.classList.remove('found');
          if (laser) laser.style.display = 'block';
          toast.style.display = 'none';

          if (videoStream) {
            videoStream.pause();
          }
        });
      }

      if (cameraFlipBtn) {
        cameraFlipBtn.addEventListener("click", () => {
          const arSystem = sceneEl.systems["mindar-image-system"];
          if (arSystem) {
            arSystem.switchCamera();
          }
        });
      }
    });
  </script>
</body>
</html>
